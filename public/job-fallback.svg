<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradJob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122b42"/>
      <stop offset="100%" stop-color="#0a1b2b"/>
    </linearGradient>
    <linearGradient id="accentGradJob" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c98a1f"/>
      <stop offset="100%" stop-color="#f0b542"/>
    </linearGradient>
    <radialGradient id="glowJob" cx="80%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#e0a537" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e0a537" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bgGradJob)"/>
  <rect width="600" height="400" fill="url(#glowJob)"/>
  <rect x="0" y="0" width="600" height="6" fill="url(#accentGradJob)"/>

  <!-- Decorative briefcase, top-right -->
  <g transform="translate(432,52)" opacity="0.95">
    <rect x="4" y="34" width="120" height="88" rx="12" fill="#132f47" stroke="#e0a537" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="44" y="14" width="40" height="24" rx="6" fill="none" stroke="#e0a537" stroke-width="5"/>
    <rect x="4" y="60" width="120" height="18" fill="#0a1b2b"/>
    <rect x="54" y="60" width="20" height="18" rx="3" fill="#f0b542"/>
    <line x1="4" y1="34" x2="4" y2="122" stroke="#e0a537" stroke-opacity="0.4" stroke-width="1"/>
  </g>

  <!-- Subtle upward trend line, suggesting career growth -->
  <g opacity="0.45" transform="translate(48,300)">
    <path d="M0 40 L40 20 L80 30 L120 -10 L160 0" fill="none" stroke="#f0b542" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="160" cy="0" r="5" fill="#f0b542"/>
  </g>

  <!-- Wordmark -->
  <text x="48" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="bold" fill="#ffffff">Cliniolab</text>

  <line x1="48" y1="205" x2="330" y2="205" stroke="#f0b542" stroke-width="1.5" opacity="0.7"/>

  <!-- Label with small briefcase icon -->
  <g transform="translate(48,222)">
    <rect x="0" y="6" width="30" height="20" rx="4" fill="none" stroke="#f0b542" stroke-width="2.5"/>
    <path d="M10 6 V2 C10 0.5 11 0 12.5 0 H17.5 C19 0 20 0.5 20 2 V6" fill="none" stroke="#f0b542" stroke-width="2.5"/>
    <line x1="0" y1="14" x2="30" y2="14" stroke="#f0b542" stroke-width="2"/>
    <text x="42" y="20" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#f0b542" letter-spacing="0.5">Job Opening</text>
  </g>
</svg>
