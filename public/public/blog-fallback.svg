<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122b42"/>
      <stop offset="100%" stop-color="#0a1b2b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2f9e7f"/>
      <stop offset="100%" stop-color="#4fc79f"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#2f9e7f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2f9e7f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <rect width="600" height="400" fill="url(#glow)"/>
  <rect x="0" y="0" width="600" height="6" fill="url(#accentGrad)"/>

  <!-- Decorative floating document/notes stack, top-right -->
  <g opacity="0.9" transform="translate(430,40)">
    <rect x="18" y="18" width="110" height="140" rx="10" fill="#0a1b2b" stroke="#2f9e7f" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="6" y="6" width="110" height="140" rx="10" fill="#132f47" stroke="#2f9e7f" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="26" y="30" width="70" height="8" rx="4" fill="#4fc79f"/>
    <rect x="26" y="48" width="86" height="5" rx="2.5" fill="#5c7f96"/>
    <rect x="26" y="60" width="86" height="5" rx="2.5" fill="#5c7f96"/>
    <rect x="26" y="72" width="60" height="5" rx="2.5" fill="#5c7f96"/>
    <rect x="26" y="94" width="86" height="5" rx="2.5" fill="#40566a"/>
    <rect x="26" y="106" width="86" height="5" rx="2.5" fill="#40566a"/>
    <rect x="26" y="118" width="46" height="5" rx="2.5" fill="#40566a"/>
  </g>

  <!-- Pulse / heartbeat line motif echoing the Cliniolab logo -->
  <g opacity="0.5" transform="translate(48,260)">
    <path d="M0 20 H40 L55 -18 L75 55 L92 20 H150" fill="none" stroke="#2f9e7f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="48" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="bold" fill="#ffffff">Cliniolab</text>

  <line x1="48" y1="205" x2="330" y2="205" stroke="#4fc79f" stroke-width="1.5" opacity="0.7"/>

  <!-- Label with small book icon -->
  <g transform="translate(48,222)">
    <path d="M0 6 C0 3 3 1 7 1 H16 V19 H7 C3 19 0 17 0 14 Z" fill="#2f9e7f"/>
    <path d="M32 6 C32 3 29 1 25 1 H16 V19 H25 C29 19 32 17 32 14 Z" fill="#4fc79f"/>
    <text x="42" y="14" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4fc79f" letter-spacing="0.5">Blog &amp; Study Notes</text>
  </g>
</svg>
